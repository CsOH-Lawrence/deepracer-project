name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 matches the Ubuntu 22.04 target the deploy wizard supports.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Only the dashboard server imports boto3; the rest is standard library.
      - name: Install test dependency
        run: python -m pip install --quiet --disable-pip-version-check boto3
      - name: Reward function tests
        run: python -m unittest discover -s reward_tests -p 'test_*.py' -v
      - name: Deployment wizard tests
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Dashboard tests
        run: python -m unittest discover -s metrics-dashboard -p 'test_*.py' -v
      - name: Log sync tests
        run: python -m unittest discover -s log-sync -p 'test_*.py' -v
      - name: Shell syntax
        run: bash -n deploy.sh && bash -n deploy-school-cpu.sh
